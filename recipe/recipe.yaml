schema_version: 1

context:
  python_min: "3.11"
  version: "3.3.1"

package:
  name: erddapy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/erddapy/erddapy-${{ version }}.tar.gz
  sha256: 6de739c67cb969e0bbdc9d8410aaa37271eef3b9994bee7ae7342a4783f7f923

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - setuptools-scm
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - pandas <4,>=0.25.2
    - requests

tests:
  - python:
      imports:
        - erddapy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python interface for ERDDAP
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://github.com/ioos/erddapy
  documentation: https://ioos.github.io/erddapy/

extra:
  recipe-maintainers:
    - ocefpaf
